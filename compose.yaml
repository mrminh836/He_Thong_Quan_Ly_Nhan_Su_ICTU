# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU) - DOCKER COMPOSE ORCHESTRATION
# Dịch vụ: MySQL 8.0 (db) + Express Backend (backend) + Vite SPA Nginx (frontend)
# Cấu hình cổng Host:
#   - MySQL:    3309 (tránh đụng cổng 3306/3307/3308)
#   - Backend:  3005 (tránh đụng cổng 3000/8080)
#   - Frontend: 5173 (tránh đụng cổng 80/3000)
#   - phpMyAdmin: 8084 (tránh đụng cổng 8080/8082)
#   - Grafana:  3001 (tránh đụng cổng 3000)
#   - Loki:     3100 (Log Aggregation & HTTP API)
#   - Alertmanager: 9093 (Cảnh báo hạ tầng & ứng dụng)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: MySQL 8.0 Database (mysql-db)
  # ----------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --general_log=1
      --general_log_file=/var/lib/mysql/mysql_general.log
      --log_output=FILE
      --loose-validate_password.policy=MEDIUM
      --loose-validate_password.length=8
      --loose-validate_password.mixed_case_count=1
      --loose-validate_password.number_count=1
      --loose-validate_password.special_char_count=1
      --loose-validate_password.check_user_name=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPassword@2026}
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-AppUser@Pass2026}
    volumes:
      # Named volume lưu trữ dữ liệu bền vững (không bị mất khi restart container)
      - mysql_data:/var/lib/mysql
      # Tự động thực thi kịch bản DDL khi khởi tạo database lần đầu
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Cấu hình bảo mật Lab 6 (General Query Log & Password Policy MEDIUM)
      - ./database/conf.d:/etc/mysql/conf.d:ro
    ports:
      # Cổng 3309 trên máy host -> 3306 trong container (dành cho DBeaver/Navicat/MySQL Workbench)
      - "${DB_PORT:-3309}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootPassword@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      app-network:
        aliases:
          - mysql-db
          - db

  # ----------------------------------------------------------------------------
  # SERVICE 2: Node.js Express Backend API (backend)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-ictu-backend
    restart: unless-stopped
    ports:
      # Cổng 3005 trên máy host -> 3005 trong container
      - "${PORT:-3005}:${PORT:-3005}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3005}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Kết nối nội bộ qua service hostname 'mysql-db' (hoặc alias 'db') cổng 3306
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hrm_db}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-AppUser@Pass2026}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      DB_AES_SECRET_KEY: ${DB_AES_SECRET_KEY:-ICTU_HRM_SECRET_KEY_2026_AES256}
      CCCD_ENCRYPTION_KEY: ${CCCD_ENCRYPTION_KEY:-${DB_AES_SECRET_KEY:-ICTU_HRM_SECRET_KEY_2026_AES256}}
      CCCD_HMAC_SECRET: ${CCCD_HMAC_SECRET:-ICTU_HRM_CCCD_HMAC_SECRET_2026_KEY}
      JWT_SECRET: ${JWT_SECRET:-ICTU_HRM_JWT_SECRET_KEY_2026_SUPER_SECURE}
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3005}/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      app-network:
        aliases:
          - backend
      monitoring:
        aliases:
          - hrm-app
          - backend

  # ----------------------------------------------------------------------------
  # SERVICE 3: Frontend SPA Nginx (frontend / hrm-app)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm-ictu-frontend
    restart: unless-stopped
    ports:
      # Cổng 5173 trên máy host -> cổng 80 Nginx trong container (Direct Dev access)
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      app-network:
        aliases:
          - hrm-app
          - frontend

  # ----------------------------------------------------------------------------
  # SERVICE 4: phpMyAdmin Web Database Manager (phpmyadmin)
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8084}:80"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # SERVICE 5: Nginx Reverse Proxy (HTTPS hrm.local Gateway)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hrm-nginx
    restart: unless-stopped
    ports:
      # Port 80: HTTP Redirect -> 301 HTTPS
      - "80:80"
      # Port 443: HTTPS Reverse Proxy cho hrm.local
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs/hrm.local.crt:/etc/nginx/certs/hrm.local.crt:ro
      - ./certs/hrm.local.key:/etc/nginx/certs/hrm.local.key:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null https://localhost:443/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # SERVICE 6: Prometheus MySQL Exporter (mysqld-exporter)
  # Cầu nối liên mạng (Dual-homed bridge) kết nối app-network và monitoring
  # ----------------------------------------------------------------------------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysqld-exporter
    restart: unless-stopped
    command:
      - "--config.my-cnf=/etc/mysqld-exporter/.my.cnf"
      - "--collect.info_schema.processlist"
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.tablestats"
      - "--collect.info_schema.tables"
      - "--collect.perf_schema.tableiowaits"
      - "--collect.perf_schema.indexiowaits"
      - "--collect.perf_schema.tablelocks"
    volumes:
      - ./monitoring/mysqld-exporter/.my.cnf:/etc/mysqld-exporter/.my.cnf:ro
    ports:
      # Bind 127.0.0.1 trên Host phục vụ kiểm thử an toàn nội bộ (Least Privilege)
      - "127.0.0.1:9104:9104"
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9104/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
      - monitoring

  # ----------------------------------------------------------------------------
  # SERVICE 7: cAdvisor Container Metrics (cadvisor)
  # Thu thập số liệu thời gian thực của Docker containers tại cổng nội bộ 8080
  # ----------------------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--max_housekeeping_interval=15s"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      # Bind 127.0.0.1:8085 trên Host (tránh xung đột cổng 8080 với phpMyAdmin)
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monitoring

  # ----------------------------------------------------------------------------
  # SERVICE 8: Node Exporter Host Metrics (node-exporter)
  # Thu thập số liệu CPU, RAM, Disk, Network hệ điều hành tại cổng nội bộ 9100
  # ----------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      # Bind 127.0.0.1:9100 trên Host phục vụ kiểm thử an toàn nội bộ
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - monitoring

  # ----------------------------------------------------------------------------
  # SERVICE 9: Prometheus Monitoring Server (prometheus)
  # Nằm độc lập trên mạng monitoring để scrape metrics
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hrm-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      # Bind 127.0.0.1 trên Host phục vụ truy cập dashboard nội bộ
      - "127.0.0.1:9090:9090"
    depends_on:
      mysqld-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
      node-exporter:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      monitoring:
        aliases:
          - prometheus

  # ----------------------------------------------------------------------------
  # SERVICE 10: Grafana Observability Dashboards (grafana)
  # Trực quan hóa hạ tầng và ứng dụng HRM với Datasource & Dashboards Provisioning
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      # Bind 127.0.0.1:3001 trên Host phục vụ truy cập dashboard nội bộ (tránh đụng cổng 3000)
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Admin@Pass2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      monitoring:
        aliases:
          - grafana

  # ----------------------------------------------------------------------------
  # SERVICE 11: Grafana Loki Log Aggregation (loki)
  # Thu thập và lưu trữ log tập trung với filesystem storage engine (TSDB v13)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      # Bind 127.0.0.1:3100 trên Host phục vụ truy cập API nội bộ (Least Privilege)
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      monitoring:
        aliases:
          - loki

  # ----------------------------------------------------------------------------
  # SERVICE 12: Promtail Docker Log Collector (promtail)
  # Đọc log stdout/stderr từ Docker socket và đẩy về Grafana Loki
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - monitoring

  # ----------------------------------------------------------------------------
  # SERVICE 13: Prometheus Alertmanager (alertmanager)
  # Quản lý, gom cụm và định tuyến cảnh báo hạ tầng & ứng dụng (port 9093)
  # ----------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      # Bind 127.0.0.1:9093 trên Host phục vụ truy cập dashboard nội bộ (Least Privilege)
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      monitoring:
        aliases:
          - alertmanager

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: hrm_ictu_mysql_data
  grafana-data:
    name: hrm_ictu_grafana_data
  loki-data:
    name: hrm_ictu_loki_data
  alertmanager-data:
    name: hrm_ictu_alertmanager_data

networks:
  app-network:
    name: hrm-app-network
    driver: bridge

  monitoring:
    name: hrm-monitoring-network
    driver: bridge

