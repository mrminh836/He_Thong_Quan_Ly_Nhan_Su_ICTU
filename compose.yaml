# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU) - DOCKER COMPOSE ORCHESTRATION
# Dịch vụ: MySQL 8.0 (db) + Express Backend (backend)
# Cấu hình cổng: Backend = 3005, MySQL = 3308 (Tránh xung đột cổng 3000 & 3306/3307)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SERVICE 1: MySQL 8.0 Database
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: hrm-ictu-mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --general_log=1
      --general_log_file=/var/lib/mysql/mysql_general.log
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPassword@2026}
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
      MYSQL_USER: ${DB_USER:-app_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-AppUser@Pass2026}
    volumes:
      # Named volume lưu trữ dữ liệu bền vững
      - mysql_data:/var/lib/mysql
      # Tự động thực thi kịch bản DDL khi khởi tạo database lần đầu
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      # Cổng 3308 trên máy host -> 3306 trong container
      - "${DB_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-RootPassword@2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - hrm-network

  # ----------------------------------------------------------------------------
  # SERVICE 2: Node.js Express Backend API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm-ictu-backend
    restart: unless-stopped
    ports:
      # Cổng 3005 trên máy host -> 3005 trong container
      - "${PORT:-3005}:${PORT:-3005}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3005}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Kết nối nội bộ qua service name 'db' cổng 3306
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-hrm_db}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-AppUser@Pass2026}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      DB_AES_SECRET_KEY: ${DB_AES_SECRET_KEY:-ICTU_HRM_SECRET_KEY_2026_AES256}
      JWT_SECRET: ${JWT_SECRET:-ICTU_HRM_JWT_SECRET_KEY_2026_SUPER_SECURE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hrm-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: hrm_ictu_mysql_data

networks:
  hrm-network:
    name: hrm-ictu-network
    driver: bridge
