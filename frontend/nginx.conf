# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU)
# CẤU HÌNH NGINX REVERSE PROXY & HTTPS TỰ KÝ X.509 (DEVSECOPS LAB)
# Domain: hrm.local | Ports: 80 (HTTP) & 443 (HTTPS)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP SERVER: Phục vụ cổng 80 & Hỗ trợ chuyển hướng / SPA Fallback
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name hrm.local localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # SPA Fallback: Mọi route (như /departments, /employees, /attendances) đều trỏ về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request /api sang Backend service trong Docker Network
    location /api/ {
        proxy_pass http://backend:3005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache các tệp tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS SERVER: Phục vụ cổng 443 TLS/SSL với Chứng chỉ X.509 RSA 2048-bit
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name hrm.local localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;

    # Đường dẫn chứng chỉ và Private Key được mount từ certs/
    ssl_certificate /etc/nginx/ssl/hrm.local.crt;
    ssl_certificate_key /etc/nginx/ssl/hrm.local.key;

    # Giao thức và thuật toán mã hóa hiện đại
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # DevSecOps Security Headers (Tiêu chuẩn Lab bảo mật)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API sang Backend
    location /api/ {
        proxy_pass http://backend:3005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy sang phpMyAdmin qua đường dẫn /phpmyadmin/
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cache các tệp tĩnh
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Trang lỗi
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
