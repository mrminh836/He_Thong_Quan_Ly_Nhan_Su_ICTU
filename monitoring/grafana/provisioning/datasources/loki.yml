# ==============================================================================
# GRAFANA DATASOURCE PROVISIONING - LOKI (HRM - ICTU)
# Tự động kết nối Grafana với Loki qua DNS nội bộ Docker (mạng monitoring)
# ==============================================================================
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
