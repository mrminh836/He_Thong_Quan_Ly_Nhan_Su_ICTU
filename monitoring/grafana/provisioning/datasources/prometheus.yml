# ==============================================================================
# GRAFANA DATASOURCE PROVISIONING - PROMETHEUS (HRM - ICTU)
# Tự động kết nối Grafana với Prometheus qua DNS nội bộ Docker (mạng monitoring)
# ==============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
