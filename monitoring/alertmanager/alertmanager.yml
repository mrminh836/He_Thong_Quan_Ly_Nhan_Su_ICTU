# ==============================================================================
# ALERTMANAGER CONFIGURATION - HRM ICTU MONITORING STACK
# Quản lý, gom cụm và định tuyến cảnh báo từ Prometheus
# ==============================================================================
global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  group_by:
    - alertname
    - job
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "default-receiver"
