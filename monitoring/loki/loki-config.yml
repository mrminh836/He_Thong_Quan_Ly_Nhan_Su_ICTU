# ==============================================================================
# GRAFANA LOKI CONFIGURATION - HRM ICTU
# Phiên bản Loki: 3.x (TSDB + Filesystem Storage Engine)
# Dữ liệu lưu trữ bền vững qua Docker Named Volume (hrm_ictu_loki_data)
# ==============================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m

limits_config:
  retention_period: 744h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
