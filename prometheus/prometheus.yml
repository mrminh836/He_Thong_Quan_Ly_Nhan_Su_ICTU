# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU) - PROMETHEUS CONFIGURATION
# Cấu hình Scrape Metrics thời gian thực (Sprint 2 - US-21 / US-29.0)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # 1. Prometheus Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. MySQL Database Exporter (Dual-network Bridge via app-network & monitoring)
  - job_name: "mysql-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          instance: "mysql-db:3306"
          service: "mysql-database"
          environment: "production"

  # 3. Host Metrics (Node Exporter - Mạng monitoring)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 4. Container Stats (cAdvisor - Mạng monitoring)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
