# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU) - PROMETHEUS CONFIGURATION
# Cấu hình Scrape Metrics thời gian thực (Sprint 2 - US-21 / US-29.0)
# Đầy đủ 5 Scrape Targets: Prometheus, Node Exporter, cAdvisor, MySQL Exporter, HRM App
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Quy tắc cảnh báo hạ tầng & ứng dụng HRM (Sprint 3 - US 31.0)
rule_files:
  - "/etc/prometheus/rules/alerts.yml"

# Kết nối Prometheus tới Alertmanager qua mạng Docker monitoring
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  # 1. Target 1 — Prometheus Self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # 2. Target 2 — Node Exporter (Host/OS Metrics)
  - job_name: "node-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "host:9100"
          service: "host-metrics"
          environment: "production"

  # 3. Target 3 — cAdvisor (Docker Containers Metrics)
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: "docker-engine:8080"
          service: "container-metrics"
          environment: "production"

  # 4. Target 4 — MySQL Exporter (Database Metrics)
  - job_name: "mysql-exporter"
    scrape_interval: 10s
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          instance: "mysql-db:3306"
          service: "mysql-database"
          environment: "production"

  # 5. Target 5 — HRM Application Backend (prom-client Runtime & HTTP Metrics)
  - job_name: "hrm-app"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["hrm-app:3005"]
        labels:
          instance: "hrm-app:3005"
          service: "hrm-backend-api"
          environment: "production"
