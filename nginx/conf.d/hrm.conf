# ==============================================================================
# HỆ THỐNG QUẢN LÝ NHÂN SỰ (HRM - ICTU)
# CẤU HÌNH NGINX REVERSE PROXY & HTTPS (US-19 / US-20 / COMMIT 1)
# Domain: hrm.local | Ports: 80 (HTTP Redirect) -> 443 (HTTPS Reverse Proxy)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP SERVER: Tự động chuyển hướng (301 Moved Permanently) sang HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name hrm.local localhost 127.0.0.1;

    # Security Headers cho HTTP redirect (301)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Giữ nguyên toàn bộ path và query string khi redirect
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. HTTPS SERVER: Lắng nghe cổng 443 với Chứng chỉ X.509 tự ký RSA 2048-bit
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name hrm.local localhost 127.0.0.1;

    # Đường dẫn chứng chỉ và Private Key (được mount read-only từ certs/)
    ssl_certificate     /etc/nginx/certs/hrm.local.crt;
    ssl_certificate_key /etc/nginx/certs/hrm.local.key;

    # Giao thức TLS an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Ẩn các header phiên bản và tránh trùng lặp header từ upstream services (Express, phpMyAdmin)
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;

    # Nạp toàn bộ Security Headers chuẩn Lab 1 & Lab 5 cấp Server
    include /etc/nginx/conf.d/security_headers.inc;

    # Chặn truy cập tuyệt đối đến các tệp nhạy cảm (Key, Certs, Config, Git, Env)
    location ~* \.(key|pem|cnf|env|git|bak|sql)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # A. PROXY TỚI ỨNG DỤNG HRM FRONTEND (hrm-app)
    # Cổng nội bộ: http://hrm-app:80
    # --------------------------------------------------------------------------
    location / {
        # Kế thừa đầy đủ bộ Security Headers và bổ sung CSP phù hợp cho Frontend SPA
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://localhost:* http://localhost:* https://hrm.local ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;

        proxy_pass http://hrm-app:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # --------------------------------------------------------------------------
    # B. PROXY TỚI BACKEND API (backend)
    # Cổng nội bộ: http://backend:3005
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3005/api/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # C. PROXY TỚI PHPMYADMIN (phpmyadmin)
    # Cổng nội bộ: http://phpmyadmin:80
    # --------------------------------------------------------------------------
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header HTTPS "on";

       
        proxy_redirect off;
    }
}
